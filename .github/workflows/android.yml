name: Android verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Verification never needs release, signing, provider, or deployment privileges.
permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, unit tests, and test compilation
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify the Gradle wrapper
        run: ./gradlew --version

      - name: Verify the mobile secret boundary
        run: python scripts/verify_mobile_secret_boundary.py .

      - name: Verify the bundled lexicon dataset
        run: python scripts/verify_lexicon_assets.py app/src/main/assets/lexicon

      - name: Verify the NLM MeSH reference atlas
        run: python scripts/verify_mesh_reference.py app/src/main/assets/mesh

      - name: Verify the additive Room migration
        run: python scripts/verify_room_migration.py

      - name: Verify release signing is fail-closed
        run: python scripts/verify_release_signing_contract.py

      - name: Parse the local startup measurement harness
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/measure_startup.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Verify the focused Baseline Profile source
        run: python scripts/verify_baseline_profile.py app/src/main/baseline-prof.txt

      - name: Run static checks and compile every test target
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin

      - name: Build the non-debuggable benchmark APK
        run: ./gradlew --no-daemon :app:assembleBenchmark

      - name: Verify the packaged Baseline Profile
        run: >-
          python scripts/verify_baseline_profile.py
          app/src/main/baseline-prof.txt
          --apk app/build/outputs/apk/benchmark/app-benchmark.apk

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cinnamon-android-verification-${{ github.run_id }}
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/apk/benchmark/**
          if-no-files-found: ignore
          retention-days: 14

  instrumentation:
    name: Android instrumentation (API 35)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Allow hardware acceleration when available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run Android tests on the managed device
        run: >-
          ./gradlew --no-daemon :app:pixel2Api35DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cinnamon-android-instrumentation-${{ github.run_id }}
          path: |
            app/build/outputs/androidTest-results/managedDevice/**
            app/build/reports/androidTests/managedDevice/**
            app/build/outputs/managed_device_android_test_additional_output/**
          if-no-files-found: ignore
          retention-days: 14
