name: Android CI/CD Build & Release

on:
  push:
    branches:
      - '**' # Triggers on push to any branch
    tags:
      - 'v*' # Triggers on tags starting with v (e.g., v1.0.0)
  workflow_dispatch: # Allows manual visual triggers in GitHub UI

permissions:
  contents: write # Required for creating releases and uploading APK assets

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history to accurately manage versioning

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from repository-level base64 template..."
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "debug.keystore.base64 not found. Fallback to generating temporary debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,OU=AIStudio,O=AIStudio,L=AIStudio,S=AIStudio,C=US"
          fi

      - name: Configure Environment (.env File)
        run: |
          cp .env.example .env
          # Replace placeholders with official repository secrets if provided by the user
          if [ ! -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            sed -i 's/GEMINI_API_KEY=.*/GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}/g' .env
          fi
          if [ ! -z "${{ secrets.AVALAI_API_KEY }}" ]; then
            sed -i 's/AVALAI_API_KEY=.*/AVALAI_API_KEY=${{ secrets.AVALAI_API_KEY }}/g' .env
          fi

      - name: Setup Keystore (Production or Self-Signed Fallback)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ ! -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding production release keystore from secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "No custom release keystore provided. Generating a fallback self-signed keystore for compilations..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=Android,OU=Android,O=Android,L=Android,S=Android,C=US"
          fi

      - name: Precompile Lint Code Check
        run: |
          ./gradlew lint --continue || echo "Warning: Lint warnings found. Continuing build..."

      - name: Build Arm & Generic APKs (Release & Debug)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: "my-upload-key.jks"
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Package & Version Artifacts
        run: |
          mkdir -p build-outputs
          
          # Compute explicit and descriptive version strings
          VERSION_NAME="v1.0.0"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${{ github.ref_name }}"
          else
            VERSION_NAME="v1.0.0-b${{ github.run_number }}"
          fi
          
          # Move and rename release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-outputs/MedicalApp-Release-${VERSION_NAME}.apk
          fi
          
          # Move and rename debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-outputs/MedicalApp-Debug-${VERSION_NAME}.apk
          fi
          
          ls -lh build-outputs/

      - name: Upload APKs to Pull Request / Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-android-apks
          path: build-outputs/*.apk
          retention-days: 14

      - name: Create Production Release on Main Hub or Version Tags
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.0-b{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Release Build v1.0.0-b{0}', github.run_number) }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: build-outputs/*.apk
          body: |
            ## 📱 Automated Release Packaging (CI/CD)
            
            This release was built, signed, and published automatically with each stable code push.
            
            ### 📦 Download Packages
            - **💎 Optimized Release Bundle**: `MedicalApp-Release-*.apk` (Compiles with maximum shrinkage and sign verification)
            - **🔧 Debug Diagnostic Bundle**: `MedicalApp-Debug-*.apk` (Optimized for quick testing and detailed log inspections)
            
            ### 🧬 Metadata Specs
            - **Source Code Branch**: `${{ github.ref_name }}`
            - **Commit SHA**: `${{ github.sha }}`
            - **Workflow Run Trace**: [Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            *Automatically compiled and distributed via GitHub Actions.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
